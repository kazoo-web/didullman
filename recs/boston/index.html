<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boston Recs · Kaz + DJ</title>
<meta name="description" content="Where Kaz and DJ like to eat and drink around Cambridge, Somerville and Boston.">
<meta name="theme-color" content="#E9C46A">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="map" class="map" role="region" aria-label="Map of recommended places"></div>

  <header class="header">
    <div class="header-text">
      <h1>Boston Recs</h1>
      <p>Kaz + DJ · Cambridge, Somerville &amp; Boston</p>
    </div>
    <a class="home-link" href="/">didullman.com</a>
  </header>

  <aside id="panel" class="panel" aria-live="polite">
    <section id="intro" class="intro">
      <p id="count" class="count">Loading places…</p>
      <ul id="legend" class="legend" aria-label="Pin colors"></ul>
      <p class="hint">Color = what we recommend it for. Tap a pin for details.</p>
    </section>

    <section id="detail" class="detail" hidden>
      <div class="handle" aria-hidden="true"></div>
      <div class="detail-scroll">
        <div class="detail-head">
          <div class="detail-title">
            <h2 id="d-name"></h2>
            <p id="d-meta" class="meta"></p>
          </div>
          <button id="d-close" class="close" type="button" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <p id="d-context" class="context" hidden></p>
        <ul id="d-tags" class="tags" hidden></ul>
        <p id="d-address" class="address"></p>
        <div id="d-notes" class="notes" hidden>
          <h3>Our notes</h3>
          <div id="d-notes-list"></div>
        </div>
      </div>
    </section>
  </aside>
</div>
<noscript><p class="noscript">This map needs JavaScript turned on.</p></noscript>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
